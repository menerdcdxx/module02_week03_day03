<!DOCTYPE html>
<html>

<body>
    <div id="header">
        <h1>Aspen's Adventure Gallery</h1>
    </div>
    <div id="content">
        <div id="mainDisplay">
            <img id="mainDisplayImage" src="assets/placeholder.png" alt="Selected Aspen image">
        </div>
        <h3>Select an image to view</h3>
        <div id="thumbnailsContainer">
            <div class="thumbnail">
                <img src="assets/Aspen1.jpg" class="thumbnailImage" alt="Aspen image 1">
                <button
                    onclick='
                    // Step 1: Select the large image with its id.
                    let mainDisplayImageHTML = document.getElementById("mainDisplayImage");
                    // Step 2: Select this thumbnail image from its thumbnail container.
                    let thumbnailImageHTML = this.parentElement.querySelector(".thumbnailImage");
                    // Step 3: Copy the thumbnail image file path to the large image.
                    mainDisplayImageHTML.src = thumbnailImageHTML.src;
                    '>View</button>
            </div>
            <div class="thumbnail">
                <img src="assets/Aspen2.jpg" class="thumbnailImage" alt="Aspen image 2">
                <button
                    onclick='
                    let mainDisplayImageHTML = document.getElementById("mainDisplayImage");
                    let thumbnailImageHTML = this.parentElement.querySelector(".thumbnailImage");
                    mainDisplayImageHTML.src = thumbnailImageHTML.src;
                    '>View</button>
            </div>
            <div class="thumbnail">
                <img src="assets/Aspen3.jpg" class="thumbnailImage" alt="Aspen image 3">
                <button
                    onclick='
                    let mainDisplayImageHTML = document.getElementById("mainDisplayImage");
                    let thumbnailImageHTML = this.parentElement.querySelector(".thumbnailImage");
                    mainDisplayImageHTML.src = thumbnailImageHTML.src;
                    '>View</button>
            </div>
            <div class="thumbnail">
                <img src="assets/Aspen4.jpg" class="thumbnailImage" alt="Aspen image 4">
                <button
                    onclick='
                    let mainDisplayImageHTML = document.getElementById("mainDisplayImage");
                    let thumbnailImageHTML = this.parentElement.querySelector(".thumbnailImage");
                    mainDisplayImageHTML.src = thumbnailImageHTML.src;
                    '>View</button>
            </div>
            <div class="thumbnail">
                <img src="assets/Aspen5.jpg" class="thumbnailImage" alt="Aspen image 5">
                <button
                    onclick='
                    let mainDisplayImageHTML = document.getElementById("mainDisplayImage");
                    let thumbnailImageHTML = this.parentElement.querySelector(".thumbnailImage");
                    mainDisplayImageHTML.src = thumbnailImageHTML.src;
                    '>View</button>
            </div>
            <div class="thumbnail">
                <img src="assets/Aspen6.jpg" class="thumbnailImage" alt="Aspen image 6">
                <button
                    onclick='
                    let mainDisplayImageHTML = document.getElementById("mainDisplayImage");
                    let thumbnailImageHTML = this.parentElement.querySelector(".thumbnailImage");
                    mainDisplayImageHTML.src = thumbnailImageHTML.src;
                    '>View</button>
            </div>
            <div class="thumbnail">
                <img src="assets/Aspen7.jpg" class="thumbnailImage" alt="Aspen image 7">
                <button
                    onclick='
                    let mainDisplayImageHTML = document.getElementById("mainDisplayImage");
                    let thumbnailImageHTML = this.parentElement.querySelector(".thumbnailImage");
                    mainDisplayImageHTML.src = thumbnailImageHTML.src;
                    '>View</button>
            </div>
            <div class="thumbnail">
                <img src="assets/Aspen8.jpg" class="thumbnailImage" alt="Aspen image 8">
                <button
                    onclick='
                    let mainDisplayImageHTML = document.getElementById("mainDisplayImage");
                    let thumbnailImageHTML = this.parentElement.querySelector(".thumbnailImage");
                    mainDisplayImageHTML.src = thumbnailImageHTML.src;
                    '>View</button>
            </div>
        </div>
    </div>
</body>

<style>
    #header {
        display: flex;
        justify-content: center;
    }

    #content {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #mainDisplay {
        margin-top: 3%;
    }

    #mainDisplay img {
        width: 50vh;
        border: 3px solid black;
    }

    #thumbnailsContainer {
        display: flex;
        justify-content: space-evenly;
        flex-wrap: wrap;
    }

    .thumbnail {
        position: relative;
        margin: 5px;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: gray;
        border: 3px solid black;
    }

    .thumbnail img {
        margin: 0;
        width: 10vh;
        object-fit: cover;
    }

    /* Part 2, step 1: hide each View button until its thumbnail is hovered. */
    .thumbnail button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
    }

    /* Part 2, step 2: reveal the View button while the thumbnail is hovered. */
    .thumbnail:hover button {
        display: block;
    }
</style>

</html>
